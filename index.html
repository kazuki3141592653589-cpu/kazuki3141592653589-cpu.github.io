<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ DOPAMINE RUSH</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0d0f12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .shake {
      animation: shake-anim 0.2s ease-in-out;
    }

    @keyframes shake-anim {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-8px, 5px); }
      50% { transform: translate(8px, -5px); }
      75% { transform: translate(-5px, -5px); }
      100% { transform: translate(0, 0); }
    }

    header {
      padding: 10px 15px;
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid #30363d;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
    }

    .hiscore-bar {
      font-size: 0.75rem;
      color: #ffd700;
      margin-bottom: 8px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: bold;
      font-family: monospace;
    }

    .stat-label {
      font-size: 0.65rem;
      color: #8b949e;
    }

    #time-display.spurt {
      color: #ff0055;
      animation: pulse 0.4s infinite alternate;
      text-shadow: 0 0 12px #ff0055;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.25); }
    }

    #combo-display {
      transition: transform 0.1s ease;
    }

    .combo-bump {
      transform: scale(1.4);
      color: #ff007f !important;
      text-shadow: 0 0 15px #ff007f;
    }

    #play-field {
      flex: 1;
      position: relative;
      background: radial-gradient(circle, #1a2332 0%, #0d0f12 100%);
    }

    .target {
      position: absolute;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      transform: scale(0);
      animation: pop-in 0.15s forwards ease-out;
      border: 2px solid rgba(255, 255, 255, 0.6);
      box-shadow: 
        inset -5px -5px 12px rgba(0, 0, 0, 0.6),
        inset 5px 5px 10px rgba(255, 255, 255, 0.8),
        0 8px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.05s ease;
    }

    .target:active {
      transform: scale(0.9) !important;
    }

    @keyframes pop-in {
      to { transform: scale(1); }
    }

    .target-gold {
      background: radial-gradient(circle at 35% 35%, #ffffff, #ffd700 60%, #b8860b 100%);
      color: #3d2b00;
      border-color: #fff;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      box-shadow: 
        inset -5px -5px 12px rgba(139, 69, 19, 0.6),
        inset 5px 5px 10px rgba(255, 255, 255, 0.9),
        0 0 20px #ffd700,
        0 8px 15px rgba(0, 0, 0, 0.5);
    }

    .target-bomb {
      background: radial-gradient(circle at 35% 35%, #ff7799, #ff0055 60%, #880022 100%);
      color: #fff;
      border-color: #ff99bb;
      box-shadow: 
        inset -5px -5px 12px rgba(0, 0, 0, 0.8),
        inset 5px 5px 10px rgba(255, 255, 255, 0.7),
        0 0 20px #ff0055,
        0 8px 15px rgba(0, 0, 0, 0.5);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 15, 18, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .hidden { display: none !important; }

    .btn {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border: none;
      color: #000;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      margin-top: 15
